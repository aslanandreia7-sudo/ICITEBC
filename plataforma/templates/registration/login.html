<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Alumnos - ICITEBC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .gradient-navy { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg gradient-navy flex items-center justify-center text-white">
                <i data-lucide="book-open" class="w-4 h-4"></i>
            </div>
            <span class="font-bold text-slate-800">ICITEBC Portal</span>
        </div>
        <a href="/" class="text-sm font-semibold text-blue-600 hover:text-blue-800 flex items-center gap-1 transition">
            <i data-lucide="home" class="w-4 h-4"></i> Regresar al inicio
        </a>
    </nav>

    <div class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-md w-full">
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
                <div class="p-8">
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">Iniciar Sesión</h2>
                    <p class="text-slate-500 text-sm mb-6">Ingresa tus credenciales para acceder a tus cursos.</p>

                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Usuario</label>
                                <input type="text" name="username" class="w-full p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Contraseña</label>
                                <input type="password" name="password" class="w-full p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition">
                            </div>
                            <button type="submit" class="w-full gradient-navy text-white py-3 rounded-xl font-bold shadow-lg hover:opacity-90 transition">
                                Entrar a la plataforma
                            </button>
                        </div>
                    </form>

                    <div class="mt-8 pt-6 border-t border-slate-100">
                        <p class="text-sm text-slate-600 text-center">
                            ¿Aún no tienes cuenta? <br>
                            <a href="#contacto" class="text-blue-600 font-bold hover:underline">Contacta a soporte para tu registro</a>
                        </p>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex justify-center">
                <a href="/admin" class="flex items-center gap-2 text-slate-400 hover:text-slate-600 transition text-xs font-medium">
                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                    Panel de Administración Segura
                </a>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
